[project]
name = "medrag"
version = "0.1.0"
description = "Clinical-guideline RAG with LlamaIndex, Qdrant and Groq"
requires-python = ">=3.11"
# Dependencies are added phase by phase.
dependencies = [
    # Phase 1: foundation
    "pydantic-settings>=2.4",
    "qdrant-client>=1.12",
    "groq>=0.11",
    # Phase 2: ingestion
    "llama-index-core>=0.12",
    "llama-cloud>=2.8",  # LlamaParse v2 API
    "httpx>=0.27",  # PubMed E-utilities (src/plugins/medrag/pubmed.py)
    # Phase 3: indexing
    "llama-index-embeddings-fastembed>=0.3",
    "fastembed>=0.4",  # not pulled in by the integration package above
    "llama-index-vector-stores-qdrant>=0.4",
    # Phase 4: query engine
    "llama-index-llms-groq>=0.3",
    "tenacity>=8.2",  # 429 retries with exponential backoff (src/core/llm.py)
    # Phase 4b: retrieval quality - no new dependencies (fastembed provides the cross-encoder
    # reranker and the BM25 sparse model)
    # Phase 6: guardrails - no new dependencies (uses the groq SDK from Phase 1)
    # Phase 7: FastAPI (httpx, needed by TestClient, is already listed under Phase 2)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",  # multipart PDF uploads (POST /sources)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.plugins.medrag" = ["policy.md"]  # Phase 6 safety policy

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
